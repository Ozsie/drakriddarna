<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
		<style>
			/* iOS WebKit paints a gray tap-highlight flash over tapped
			   elements (the full-screen game canvas in particular);
			   the game draws its own press feedback, so it is disabled. */
			html {
				-webkit-tap-highlight-color: transparent;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
