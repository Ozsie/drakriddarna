name: PR Check

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'synchronize'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - run: npm run lint

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - run: npm run prettier

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - run: npm test

  difficulty:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - name: Run difficulty benchmark
        run: npm run benchmark
        env:
          BENCHMARK_REPORT_FILE: difficulty-report.txt
      - name: Collect difficulty report
        run: |
          echo "BENCHMARK_REPORT<<EOF" >> "$GITHUB_ENV"
          cat difficulty-report.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - name: Post difficulty benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- benchmark:difficulty -->';
            const report = process.env.BENCHMARK_REPORT;
            if (!report || !report.trim()) {
              core.notice('No difficulty report produced; skipping comment.');
              return;
            }
            const body = [
              marker,
              '## Difficulty benchmark results',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `_From run ${context.runId} at ${context.sha.slice(0, 7)}._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  rendering:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.14
        uses: actions/setup-node@v1
        with:
          node-version: 18.14
      - run: npm ci
      - name: Run rendering benchmark
        run: npm run benchmark:rendering
        env:
          BENCHMARK_REPORT_FILE: rendering-report.txt
      - name: Collect rendering report
        run: |
          echo "BENCHMARK_REPORT<<EOF" >> "$GITHUB_ENV"
          cat rendering-report.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - name: Post rendering benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- benchmark:rendering -->';
            const report = process.env.BENCHMARK_REPORT;
            if (!report || !report.trim()) {
              core.notice('No rendering report produced; skipping comment.');
              return;
            }
            const body = [
              marker,
              '## Rendering benchmark results',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `_From run ${context.runId} at ${context.sha.slice(0, 7)}._`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
